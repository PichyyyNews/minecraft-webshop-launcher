services:
  db:
    image: mongo:6.0
    container_name: mc-webshop-db
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - mc-webshop-network

  backend:
    build:
      context: ./server
    container_name: mc-webshop-backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=${BACKEND_PORT:-5000}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN:-localhost}}
      - API_URL=${API_URL:-https://${DOMAIN:-localhost}/api-backend}
      - LAUNCHER_URL=${LAUNCHER_URL:-https://${DOMAIN:-localhost}:1420}
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - db
    networks:
      - mc-webshop-network

  frontend:
    build:
      context: ./mc-webshop
      args:
        - NEXT_PUBLIC_API_URL=/api-backend
    container_name: mc-webshop-frontend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
    depends_on:
      - backend
    networks:
      - mc-webshop-network

  launcher:
    build:
      context: ./launcher
    container_name: mc-webshop-launcher
    restart: always
    depends_on:
      - backend
    networks:
      - mc-webshop-network

  proxy:
    image: caddy:2.7-alpine
    container_name: mc-webshop-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "1420:1420"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - frontend
      - backend
      - launcher
    networks:
      - mc-webshop-network

networks:
  mc-webshop-network:
    driver: bridge

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
